[project]
name = "ptfx-gpu"
version = "0.1.0"
description = "GPU interpreter for the tracked-fx tools (PRODKIT_PTFX_PYTHON)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.8",
  "torchvision",
  "numpy",
  "scipy",
  "opencv-python-headless",
  "pillow>=12.3.0",
  "einops",
  "prettytable",
  "tqdm",
  "imageio",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
