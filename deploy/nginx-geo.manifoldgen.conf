# geo.manifoldgen.com — agent-facing markdown mirror served by the main Go
# process via host-based routing. Origin TLS is self-signed; the Cloudflare
# proxied zone provides the public certificate. Reuses the manifoldgen_backend
# upstream declared by the apex vhost (same nginx http context).
server {
    listen 80;
    listen 443 ssl http2;
    server_name geo.manifoldgen.com;
    ssl_certificate /etc/nginx/ssl/geo.manifoldgen.com.crt;
    ssl_certificate_key /etc/nginx/ssl/geo.manifoldgen.com.key;

    location / {
        proxy_pass http://manifoldgen_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    access_log /var/log/nginx/geo.manifoldgen.com.access.log;
    error_log /var/log/nginx/geo.manifoldgen.com.error.log;
}
