upstream manifoldgen_backend {
    server 127.0.0.1:8116;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name manifoldgen.com www.manifoldgen.com;
    ssl_certificate /etc/nginx/ssl/manifoldgen.com.crt;
    ssl_certificate_key /etc/nginx/ssl/manifoldgen.com.key;

    client_max_body_size 50M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Keep one public URL for crawlers and prevent www from splitting link
    # equity and analytics from the canonical apex host.
    if ($host = www.manifoldgen.com) {
        return 301 https://manifoldgen.com$request_uri;
    }

    location / {
        proxy_pass http://manifoldgen_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    access_log /var/log/nginx/manifoldgen.com.access.log;
    error_log /var/log/nginx/manifoldgen.com.error.log;
}
