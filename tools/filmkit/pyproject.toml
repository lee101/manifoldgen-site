[project]
name = "filmkit"
version = "0.1.0"
description = "Anime/comic film production kit: concept art, LLM art review, FLUX 3 Max video, animefx layers, SFX mixing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.9", "pillow>=10", "scipy>=1.11"]

[project.scripts]
animefx = "filmkit.animefx.cli:main"
filmkit = "filmkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filmkit"]
